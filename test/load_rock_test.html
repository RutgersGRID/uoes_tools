<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      font-family: Georgia, serif;
      max-width: 620px;
      margin: 60px auto;

      background: #f4f7f9;

      text-align: center;
    }
    .card {
      background: white;
      border: 2px solid #007FAC;
      border-radius: 8px;
      padding: 28px;
    }
    h1 { font-size: 24px; margin-top: 0; }
    p { line-height: 1.6; }
    button {
      font-family: inherit;
      font-size: 18px;
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      background: #CC0033;
      color: white;
      cursor: pointer;
      margin: 6px;
    }
    button:hover { background: #A30029; }
    button.secondary {
      background: white;
      color: #CC0033;
      border: 2px solid #CC0033;
      font-size: 15px;
      padding: 8px 20px;
    }
    button.secondary:hover { background: #CC0033; color: white; }
    button:focus { outline: 2px solid #007FAC; outline-offset: 2px; }
    #status { font-weight: bold; color: #A30029; min-height: 1.4em; }
    .warn { font-size: 14px; color: #666; }
  </style>
</head>

      (13 modules, 4 goals, full schedule) into the Course Content Planner,
      then opens it.</p>
    <p class="warn">This replaces anything currently saved in the planner in
      this browser. Use "Clear" afterward to empty the planner again.</p>
    <button id="loadBtn">Load test data &amp; open planner</button>
    <br>
    <button id="clearBtn" class="secondary">Clear planner data</button>
    <p id="status" role="status"></p>

    const status = document.getElementById("status");

    document.getElementById("loadBtn").addEventListener("click", () => {
      try {
        localStorage.setItem(KEY, JSON.stringify(SEED));
        status.textContent = "Loaded! Opening the planner…";
        setTimeout(() => { window.location.href = "../course_planner.html"; }, 400);
      } catch (e) {
        status.textContent = "Could not save: " + e.message;
      }
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      try {
        localStorage.removeItem(KEY);
        status.textContent = "Planner data cleared.";
      } catch (e) {
        status.textContent = "Could not clear: " + e.message;
      }
    });
  </script>
</body>
</html>
